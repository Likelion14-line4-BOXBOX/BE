spring.application.name=boxbox
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/boxbox?connectionTimeZone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:boxbox}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
boxbox.profile.allowed-avatar-ids=${PROFILE_ALLOWED_AVATAR_IDS:avatar_default}
