spring.application.name=boxbox
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/boxbox?connectionTimeZone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:boxbox}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
boxbox.posts.media-base-url=${POST_MEDIA_BASE_URL:}
boxbox.posts.view-window=${POST_VIEW_WINDOW:PT10M}
boxbox.profile.allowed-avatar-ids=${PROFILE_ALLOWED_AVATAR_IDS:avatar_default}
boxbox.chat.active-season=${CHAT_ACTIVE_SEASON:2026}
boxbox.chat.event-retention=${CHAT_EVENT_RETENTION:PT10M}
boxbox.chat.stream-poll-interval=${CHAT_STREAM_POLL_INTERVAL:PT0.25S}
boxbox.chat.stream-heartbeat=${CHAT_STREAM_HEARTBEAT:PT15S}
boxbox.chat.stream-lifetime=${CHAT_STREAM_LIFETIME:PT5M}
boxbox.chat.stream-max-connections=${CHAT_STREAM_MAX_CONNECTIONS:256}
boxbox.auth.jwt-secret=${AUTH_JWT_SECRET:}
boxbox.auth.extended-access-user-ids=${AUTH_EXTENDED_ACCESS_USER_IDS:}
boxbox.auth.extended-access-lifetime=${AUTH_EXTENDED_ACCESS_LIFETIME:P10D}
boxbox.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
boxbox.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
boxbox.auth.refresh-lifetime=${AUTH_REFRESH_LIFETIME:P14D}
boxbox.auth.initial-coins=${AUTH_INITIAL_COINS:1000000}
boxbox.auth.rate.signup=${AUTH_RATE_SIGNUP:10}
boxbox.auth.rate.login-ip=${AUTH_RATE_LOGIN_IP:30}
boxbox.auth.rate.login-account=${AUTH_RATE_LOGIN_ACCOUNT:10}
boxbox.auth.rate.refresh=${AUTH_RATE_REFRESH:60}

boxbox.market.preparation.enabled=${MARKET_PREPARATION_ENABLED:true}
boxbox.market.preparation.season=${MARKET_PREPARATION_SEASON:2026}
boxbox.market.preparation.first-round-open-at=${MARKET_FIRST_ROUND_OPEN_AT:}
boxbox.market.settlement.enabled=${MARKET_SETTLEMENT_ENABLED:false}

boxbox.reference-data.season=${REFERENCE_DATA_SEASON:2026}
boxbox.reference-data.version=${REFERENCE_DATA_VERSION:demo-2026-01}
